    }catch(e){this.src=this.f=this.an=null;return false}
  },
  apply(){
    const g=EQ_PRESETS[this.cur]||EQ_PRESETS.off;
    if(this.wired)this.f.forEach((x,i)=>{x.gain.value=g[i]});
    $$('.eq-chips button').forEach(b=>b.classList.toggle('on',b.dataset.eq===this.cur));
    if(this.wired&&this.cur!=='off')this.loop();else this.clearCv();
  },
  stopRaf(){cancelAnimationFrame(this.raf);clearTimeout(this.raf)},
  loop(){
    this.stopRaf();
    const step=()=>{
      if(!this.wired)return;
      const cv=$('#eqCv');
      if(!cv||this.cur==='off'){this.clearCv();return}
      /* плеер свёрнут — не рисуем 60 раз в секунду, раз в 400 мс проверяем, не открыли ли снова */
      if(!nowOpen()){this.raf=setTimeout(step,400);return}
      const cx=cv.getContext('2d'),d=new Uint8Array(this.an.frequencyBinCount);
      this.an.getByteFrequencyData(d);
      cx.clearRect(0,0,cv.width,cv.height);
      const bars=12,st2=Math.floor(d.length/bars);
      for(let i=0;i<bars;i++){
        const v=Math.max(2,(d[i*st2+1]/255)*cv.height);
        cx.fillStyle='rgba('+PAL.rgb+','+(.45+v/cv.height*.55)+')';
        cx.fillRect(i*(cv.width/bars)+1.5,cv.height-v,3,v);
      }
      this.raf=requestAnimationFrame(step);
    };
    this.raf=requestAnimationFrame(step);
  },
  clearCv(){this.stopRaf();const cv=$('#eqCv');if(cv)cv.getContext('2d').clearRect(0,0,cv.width,cv.height)},
  resume(){if(this.ctx&&this.ctx.state!=='running'){const p=this.ctx.resume();if(p&&p.catch)p.catch(()=>{})}},
  unwire(){
    /* Полный выход из графа: глушим ноды, пересоздаём аудио-элемент (обратной операции у createMediaElementSource нет) */
    clearTimeout(this.wdT);if(this._wdClean)try{this._wdClean()}catch(e){}
    this.clearCv();
    try{if(this.src)this.src.disconnect()}catch(e){}
    try{(this.f||[]).forEach(x=>{try{x.disconnect()}catch(e){}})}catch(e){}
    try{if(this.an)this.an.disconnect()}catch(e){}
    this.src=this.f=this.an=null;
    if(this.wired)rebuildAudio(); // сам ставит wired=false и перевешивает события
  },
  watchdog(st){
    /* Страховка после EQ-(пере)подключения. Решает сетевой ПРОГРЕСС, а не «N секунд в лоб»:
       на медленном LTE перезагрузка потока идёт 10+ с. Прогресса нет 6 с подряд (всего до 20 с) —
       граф считаем мёртвым: снимаем EQ, чистый элемент. Молчащему контексту сначала даём шанс проснуться. */
    clearTimeout(this.wdT);if(this._wdClean)this._wdClean();
    this._gotPlay=false;this._prog=Date.now();
    const poke=()=>{this._prog=Date.now()},evs=['progress','loadedmetadata','canplay'];
    evs.forEach(e=>audio.addEventListener(e,poke));
    const a=audio;
    this._wdClean=()=>{evs.forEach(e=>a.removeEventListener(e,poke));this._wdClean=null};
    let arms=0;
    const tick=()=>{
      if(curId!==st.id){if(this._wdClean)this._wdClean();return}
      if(this._gotPlay||state.playing){
        if(this._wdClean)this._wdClean();
        if(state.playing&&this.wired&&this.ctx&&this.ctx.state!=='running'){
          this.resume();
          setTimeout(()=>{if(curId===st.id&&state.playing&&this.wired&&this.ctx&&this.ctx.state!=='running')this.degrade(st)},1800);
        }
        return;
      }
      if(Date.now()-this._prog<6000&&arms<5){arms++;this.wdT=setTimeout(tick,2000);return}
      if(this._wdClean)this._wdClean();
      this.degrade(st);
    };
    this.wdT=setTimeout(tick,7000);
  },
  degrade(st,msg){
    /* Аварийный возврат эфира: EQ off → чистый элемент → перезапуск без crossOrigin.
       Если play() вне жеста отклонён (iOS) — пилюля «Продолжить» */
    clearTimeout(this.wdT);
    if(this.cur==='off'&&!this.wired)return;
    this.off();this.unwire();
    audio.removeAttribute('crossorigin');
    if(st&&curId===st.id){
      retries=0;connect(st,false);
      if(!this._degToast){this._degToast=true;toast(msg||'Эквалайзер отключён: эта станция не поддерживает обработку звука')}
      setTimeout(()=>{if(!state.playing&&curId===st.id)this.showResume()},1700);
    }
  },
  showResume(){toast('Нажмите ▶, чтобы продолжить эфир')},
  guard(){
    /* Возврат из фона/лок-скрина: контекст не ожил сам — будим; не помогло за 2.5 с — degrade */
    if(!this.wired||!this.ctx||this.ctx.state==='running')return;
    this.resume();
    setTimeout(()=>{
      if(this.wired&&this.ctx&&this.ctx.state!=='running'&&state.playing&&curId){const st=byId(curId);if(st)this.degrade(st)}
    },2500);
  },
  async ensure(st){
    /* ТОЛЬКО фоновая проба CORS для кэша — без переподключений: второй connect() вне жеста
       на iOS отклонялся, и эфир «вечно подключался». Станция не допускает обработку — снимаем пресет. */
    if(!st||this.wired||this.cur==='off'||st.type==='hls')return;
    const ok=await this.probe(st);
    if(curId!==st.id||this.wired)return;
    if(!ok){
      if(this.cur!=='off')this.off();
      if(!this.noEqToast){this.noEqToast=true;toast('Для станции «'+st.name+'» эквалайзер недоступен')}
    }
  }
};
/* Вежливый inline-ответ под чипами EQ; если ряд скрыт (ландшафтный телефон) — тост */
let eqBusy=false; // защита от двойного клика, пока идёт проба/перезапуск
function eqNote(msg){
  const note=$('#eqNote'),row=$('#nowEqRow');
  if(getComputedStyle(row).display==='none'){toast(msg);return}
  note.textContent=msg;note.classList.add('show');
  clearTimeout(eqNote._t);eqNote._t=setTimeout(()=>note.classList.remove('show'),4200);
}
async function setEQ(p){
  const st=state.cur;
  if(p==='off'){EQ.off();buzz(HAP.tap);toast('Эквалайзер выключен');return}
  if(!st){EQ.off();toast('Сначала выберите станцию');buzz(HAP.err);return}
  if(eqBusy)return;
  /* ВЕРДИКТ ДО ЛЮБЫХ КАСАНИЙ ПОТОКА: сначала узнаём (проба/кэш), допускает ли станция обработку,
     и только потом ставим crossOrigin и перезапускаем эфир. Несовместимая станция получает вежливый
     отказ под чипами, а эфир не прерывается. */
  eqBusy=true;
  const prev=EQ.cur;
  EQ.cur=p;EQ.apply(); // мгновенный отклик чипа, вердикт — следом
  try{
    if(st.type!=='hls'&&EQ.cors[st.url]===undefined){
      await EQ.probe(st);
      if(curId!==st.id){EQ.cur=prev;LS.set('eq',prev);EQ.apply();return} // станцию сменили, пока шла проба
    }
    if(st.type!=='hls'&&EQ.cors[st.url]===false){
      EQ.off();audio.removeAttribute('crossorigin');
      eqNote('Для станции «'+st.name+'» эквалайзер недоступен — эфир продолжается без обработки');
      buzz(HAP.err);return;
    }
    /* HLS не трогаем: MSE CORS-чист, а нативному Safari crossOrigin ломает загрузку плейлиста */
    let noReload=st.type==='hls';
    if(!noReload){
      noReload=audio.crossOrigin==='anonymous'&&EQ.wired&&state.playing; // граф уже активен — просто меняем пресет
      audio.crossOrigin='anonymous';
    }
    if(!EQ.wire()){
      EQ.off();audio.removeAttribute('crossorigin');
      toast('Эквалайзер недоступен в этом браузере');buzz(HAP.err);return;
    }
    EQ.resume(); // в жесте — обязательно: после await iOS активацию теряет
    if(!noReload){ // перезапуск с crossOrigin — только когда поток реально нужно перезагрузить
      audio.pause();audio.removeAttribute('src');audio.load();
      audio.src=st.url;
      bufferingOn();
      tryPlay(st);
      NP.start(st);
      EQ.watchdog(st); // не заиграло — авто-возврат чистого эфира
    }
    EQ.apply();
    toast('Эквалайзер: '+$('.eq-chips [data-eq="'+p+'"]').textContent);
    buzz(HAP.tap);
  }finally{eqBusy=false}
}
$$('.eq-chips button').forEach(b=>b.addEventListener('click',()=>setEQ(b.dataset.eq)));
/* Возврат из фона: проверяем, что аудиоконтекст жив (iOS усыпляет его при локе) */
document.addEventListener('visibilitychange',()=>{if(!document.hidden)EQ.guard()});

/* ==================== PLAYBACK CORE ==================== */
function playStation(st){if(!st)return;if(curId===st.id)togglePlay();else connect(st,false)}
/* play() без жеста браузер может отклонить — тогда не зависаем в «Подключение…», а предлагаем «Продолжить» */
function tryPlay(st){
  audio.play().catch(e=>{
    if(e&&e.name==='NotAllowedError'&&pendingId===st.id){state.buffering=false;renderPlayState();EQ.showResume()}
  });
}
function togglePlay(){
  const st=state.cur;
  if(!st){connect(byId('capital'),false);return}
  if(state.playing){audio.pause();return}
  /* Запись продолжается с места паузы; живой эфир — переподключаем к «живому краю», а не доигрываем
     устаревший буфер (сюда же ведёт кнопка «играть» из шторки уведомлений) */
  if(st.rec&&audio.getAttribute('src')&&!audio.ended){tryPlay(st);return}
  connect(st,false);
}
async function connect(st,isRetry){
  destroyHls();
  if(!isRetry)retries=0;
  pendingId=st.id;
  const switching=curId!==st.id;
  if(switching){curId=st.id;state.cur=st;LS.set('last',st.id);listenMs=0}
  state.buffering=true;
  const corsOk=st.type==='hls'?true:(EQ.cors[st.url]===true);
  if(EQ.wired&&!corsOk)rebuildAudio(); // элемент в графе играет только CORS-потоки — чистим
  EQ.beforeSrc(st,corsOk);             // crossOrigin ДО установки src — иначе тишина или отказ грузить
  audio.pause();audio.removeAttribute('src');audio.load();
  if(switching){updateAmbient(st);pushRecent(st.id);setMediaSession(st);if(nowOpen())renderNow(st)}
  renderPlayer();renderPlayState();
  if(st.type==='hls'){
    if(NATIVE_HLS)audio.src=st.url;
    else{
      const ok=await ensureHlsLib();
      if(pendingId!==st.id)return;
      if(!ok){toast('Не удалось загрузить HLS-плеер');state.buffering=false;renderPlayState();return}
      hls=new Hls({liveSyncDurationCount:3,manifestLoadingTimeOut:12000,manifestLoadingMaxRetry:1});
      hls.on(Hls.Events.ERROR,(ev,d)=>{if(d.fatal&&pendingId===st.id)handleFail(st)});
      hls.loadSource(st.url);hls.attachMedia(audio);
    }
  }else audio.src=st.url;
  /* EQ активен и поток подтверждённо CORS — граф ставим СИНХРОННО, в жесте пользователя */
  if(EQ.wired)EQ.resume();
  else if(EQ.cur!=='off'&&corsOk&&EQ.wire())EQ.resume();
  tryPlay(st);
  NP.start(st);EQ.ensure(st);
  if(EQ.wired&&EQ.cur!=='off')EQ.watchdog(st);else clearTimeout(EQ.wdT);
}
function handleFail(st){
  /* Сбой в EQ-режиме (crossOrigin/граф): снимаем обработку и перезапускаем эфир чистым элементом */
  if(EQ.wired||audio.crossOrigin==='anonymous'){
    EQ.off();EQ.unwire();audio.removeAttribute('crossorigin');
    retries=0;connect(st,false);
    toast('Эквалайзер отключён для восстановления эфира');
    setTimeout(()=>{if(!state.playing&&curId===st.id)EQ.showResume()},1700);
    return;
  }
  if(retries<1){retries++;toast('Переподключаемся к «'+st.name+'»…');setTimeout(()=>{if(pendingId===st.id)connect(st,true)},1800)}
  else{
    toast(st.id==='am1'&&location.protocol==='file:'
      &&!NATIVE?'Apple Music 1: Chrome блокирует CORS для file:// — откройте в Safari или через http-сервер'
      :'Станция «'+st.name+'» сейчас недоступна');
    state.buffering=false;state.playing=false;renderPlayState();
  }
}
/* Следующая/предыдущая — по станциям той же страны (как карусель в Now Playing), по кругу.
   Страна из одной станции — по всему каталогу */
function step(dir){
  let list=state.cur?STATIONS.filter(s=>s.cc===state.cur.cc):STATIONS;
  if(list.length<2)list=STATIONS;
  const i=curId?list.findIndex(s=>s.id===curId):-1;
  connect(list[(i+dir+list.length)%list.length],false);
}
function bufferingOn(){state.buffering=true;renderPlayState()}

const SLEEP=[[0,'Выключен'],[15,'15 минут'],[30,'30 минут'],[45,'45 минут'],[60,'1 час'],[90,'1,5 часа']];

/* Свайп вниз по шапке/грабберу закрывает шторку (с ведением пальца) */
(function(){
  const panel=$('.sheet-panel');
  let sy=0,dy=0,drag=false;
  const y=e=>e.touches?e.touches[0].clientY:e.clientY;
  const begin=e=>{if(!$('#sheet').classList.contains('open'))return;drag=true;dy=0;sy=y(e);panel.style.transition='none'};
  const move=e=>{if(!drag)return;dy=Math.max(0,y(e)-sy);if(dy>0&&e.cancelable)e.preventDefault();panel.style.transform=`translate(-50%,${dy}px)`};
  const reset=()=>{drag=false;panel.style.transition='';panel.style.transform=''};
  const end=()=>{if(!drag)return;const d=dy;reset();dy=0;if(d>96)closeSheet()};
  [$('#sheetGrab'),$('#sheetHead')].forEach(el=>{
    el.addEventListener('touchstart',begin,{passive:true});
    el.addEventListener('touchmove',move,{passive:false});
    el.addEventListener('touchend',end);
    el.addEventListener('touchcancel',()=>{if(drag){reset();dy=0}}); // iOS прерывает жест системным свайпом
    el.addEventListener('mousedown',begin);
  });
  document.addEventListener('mousemove',move);
  document.addEventListener('mouseup',end);
})();

let queries=LS.get('queries',[]);

  q=(q||'').trim();if(q.length<2)return;

function shelfHTML(t,list,cc,all){

const headHTML=(t,n)=>`<div class="shelf-head"><h3>${t}</h3><span class="cnt">${num(n,W.st)}</span></div>`;
/* ===== Ленивый монтаж: первые LZ_CHUNK карточек сразу, остальное — чанками по IntersectionObserver ===== */
const LZ_CHUNK=14,LZ_STEP=18;let lzIO=null;const lzQ=[];
function lzGrid(list){
  const head=list.slice(0,LZ_CHUNK).map(cardHTML).join('');
  if(list.length<=LZ_CHUNK)return `<div class="grid">${head}</div>`;
  lzQ.push(list.slice(LZ_CHUNK));
  return `<div class="grid">${head}<i class="lz-sent" data-lz="${lzQ.length-1}"></i></div>`;
}
function initLazy(){
  if(lzIO){lzIO.disconnect();lzIO=null}
  /* Таргет — полка: у скипнутой content-visibility полки потомки без layout, но её box есть всегда */
  const tgts=[...$$('.lz-sent')].map(s=>s.closest('.shelf')||s.parentElement);
  if(!tgts.length)return;
  lzIO=new IntersectionObserver(ents=>{
    ents.forEach(en=>{
      if(!en.isIntersecting)return;
      const sent=en.target.querySelector('.lz-sent'),rest=sent&&lzQ[+sent.dataset.lz];
      if(!rest)return;
      sent.insertAdjacentHTML('beforebegin',rest.splice(0,LZ_STEP).map(cardHTML).join(''));
      lzIO.unobserve(en.target);
      if(rest.length)lzIO.observe(en.target);else sent.remove();
    });
  },{rootMargin:'1100px 0px'});
  tgts.forEach(el=>lzIO.observe(el));
}

/* Скролл-индикатор списка станций: тонкая полоска справа, как в iOS */
(function(){
  const list=$('#nowList'),ind=document.createElement('i');
  ind.className='scr-ind';ind.innerHTML='<b></b>';nowEl.appendChild(ind);
  const thumb=ind.firstChild;let hideT=null;
  function place(){
    const r=list.getBoundingClientRect(),p=nowEl.getBoundingClientRect();
    if(r.height<24){ind.classList.remove('vis');return}
    ind.style.top=(r.top-p.top)+'px';ind.style.height=r.height+'px';
    ind.style.right=Math.max(3,p.right-r.right+3)+'px';
  }
  function paint(){
    const sh=list.scrollHeight,ch=list.clientHeight;
    if(sh-ch<10||ch<24){ind.classList.remove('vis');return}
    const th=Math.max(34,Math.round(ch*ch/sh)),y=Math.round(list.scrollTop/(sh-ch)*(ch-th));
    thumb.style.height=th+'px';thumb.style.transform='translateY('+y+'px)';
    ind.classList.add('vis');clearTimeout(hideT);hideT=setTimeout(()=>ind.classList.remove('vis'),650);
  }
  list.addEventListener('scroll',paint,{passive:true});
  if(window.ResizeObserver)new ResizeObserver(place).observe(list);
  addEventListener('resize',place,{passive:true});
  nowEl.addEventListener('transitionend',e=>{if(e.target===nowEl)place()});
})();

/* ===== Полоса «в эфире» (мини-плеер и Now Playing): у эфира — время прослушивания, у записи — реальный прогресс ===== */
let listenMs=0,listenAt=0;
const fmtT=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=String(s%60).padStart(2,'0');return h?h+':'+String(m).padStart(2,'0')+':'+c:m+':'+c};
function tickProg(){
  if(document.hidden)return;
  const st=state.cur,now=Date.now(),bar=$('#pBar');
  if(state.playing&&listenAt)listenMs+=now-listenAt;
  listenAt=now;
  bar.hidden=!st;if(!st)return;
  const d=audio.duration,known=!!st.rec&&isFinite(d)&&d>0,pct=known?audio.currentTime/d*100:100;
  bar.classList.toggle('live',!known);bar.classList.toggle('run',state.playing);
  bar.style.setProperty('--pw',pct+'%');
  if(!nowOpen())return;
  const np=$('#nowProg');
  np.classList.toggle('live',!known);np.classList.toggle('run',state.playing);
  $('#npFill').style.setProperty('--pw',pct+'%');
  $('#npL').textContent=known?fmtT(audio.currentTime):st.rec?'Запись':'В эфире';
  $('#npR').textContent=known?'−'+fmtT(d-audio.currentTime):fmtT(listenMs/1000);
}

function closeNow(noPop){
  nowEl.classList.remove('open');nowEl.setAttribute('aria-hidden','true');
  syncThemeColor();
  /* Системный «назад» должен закрыть следующий экран, а не уйти со страницы;
     npDepth страхует от повторного back (двойной клик/гонки) */
  if(!noPop&&npDepth>0){try{if(history.state&&history.state.np){npDepth--;history.back()}}catch(e){}}
}
/* История браузера как стек модалки: open — push, «назад»/свайп от края — свернуть плеер */
let npOpenedAt=0,npDepth=0;
function npSyncHistory(){
  npOpenedAt=Date.now();
  try{if(!(history.state&&history.state.np)){history.pushState({np:1},'');npDepth++}}catch(e){}
}
addEventListener('popstate',e=>{
  if(!nowOpen()){npDepth=Math.max(0,e.state&&e.state.np?npDepth:0);return} // закрыли жестом — запись потребляется нашим back
  if(e.state&&e.state.np)return;
  if(npDepth>0)npDepth--;
  /* гонка «закрыл и тут же снова открыл»: записи ещё нет — восстанавливаем */
  if(Date.now()-npOpenedAt<500){try{history.pushState({np:1},'');npDepth++}catch(err){}}
  else closeNow(true);
});

/* ==================== ЖЕСТЫ ====================
   • потянуть вниз по Now Playing (шапка, мета, фон И карусель) — свернуть с ведением пальца
   • мышь: drag вниз по шапке/мете/фону — то же на десктопе
   • свайп влево/вправо по плееру — следующая/предыдущая станция
   • свайп вверх по мини-плееру — открыть Now Playing
   • системный «назад» при открытом плеере — свернуть его (см. popstate)       */
(function(){
  /* Ведение: панель едет за пальцем (0.6×), пружина при отпускании; порог — 110 px или быстрый флик */
  const follow=dy=>{nowEl.style.transition='none';nowEl.style.transform='translateY('+Math.max(0,dy*.6)+'px)';nowEl.style.opacity=String(Math.max(.4,1-dy/900))};
  const unfollow=()=>{nowEl.style.transition='';nowEl.style.transform='';nowEl.style.opacity=''};
  const release=(dy,dt)=>{unfollow();if(dy>110||(dy>60&&dt<260)){closeNow();buzz(HAP.close)}};
  const grabOk=e=>nowOpen()&&!e.target.closest('.now-list,input,button,.ctl');
  /* Touch: осевой замок — побеждает ось, первой перешагнувшая порог.
     Горизонталь = следующая/предыдущая станция по ВСЕМУ экрану, вертикаль = сворачивание */
  let dr=null;
  nowEl.addEventListener('touchstart',e=>{if(grabOk(e))dr={x:e.touches[0].clientX,y:e.touches[0].clientY,t:Date.now(),drag:null}},{passive:true});
  nowEl.addEventListener('touchmove',e=>{
    if(!dr||dr.drag==='skip')return;
    const dx=e.touches[0].clientX-dr.x,dy=e.touches[0].clientY-dr.y;
    if(!dr.drag){
      if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy))dr.drag='skip';
      else if(dy>10&&Math.abs(dy)>=Math.abs(dx))dr.drag='close';
      if(!dr.drag)return;
    }
    if(dr.drag==='close')follow(dy);
    if(e.cancelable)e.preventDefault();
  },{passive:false});
  nowEl.addEventListener('touchend',e=>{
    if(!dr)return;
    const dx=e.changedTouches[0].clientX-dr.x,dy=e.changedTouches[0].clientY-dr.y,dt=Date.now()-dr.t,adx=Math.abs(dx);
    if(dr.drag==='close')release(dy,dt);
    else if(dr.drag==='skip'&&curId&&((adx>55&&Math.abs(dy)<44)||(adx>34&&adx>Math.abs(dy)*1.4&&dt<280))){buzz(HAP.skip);step(dx<0?1:-1)}
    dr=null;
  },{passive:true});
  /* touchcancel: iOS прерывает тач системным жестом — без сброса панель замирала на полпути */
  nowEl.addEventListener('touchcancel',()=>{if(dr)unfollow();dr=null});
  /* Mouse: drag вниз по шапке/мете/фону (десктоп) */
  let md=null;
  nowEl.addEventListener('mousedown',e=>{
    if(!grabOk(e))return;
    md={y:e.clientY,t:Date.now(),drag:false};e.preventDefault();
  });
  addEventListener('mousemove',e=>{
    if(!md)return;const dy=e.clientY-md.y;
    if(dy>6||md.drag){md.drag=true;follow(dy);document.body.style.cursor='grabbing'}
  },{passive:true});
  addEventListener('mouseup',e=>{
    if(!md)return;
    if(md.drag)release(e.clientY-md.y,Date.now()-md.t);
    md=null;document.body.style.cursor='';
  },{passive:true});
  /* Мини-плеер: свайп вверх открывает */
  let pu=null;const pl=$('#player');
  pl.addEventListener('touchstart',e=>{pu={y:e.touches[0].clientY,t:Date.now()}},{passive:true});
  pl.addEventListener('touchend',e=>{
    if(pu&&pu.y-e.changedTouches[0].clientY>40&&Date.now()-pu.t<650&&curId){buzz(HAP.open);openNow()}
    pu=null;
  },{passive:true});
  pl.addEventListener('touchcancel',()=>{pu=null},{passive:true});
})();

/* ==================== EVENTS ==================== */
document.addEventListener('click',e=>{
  const t=e.target,hit=s=>t.closest(s);
  let el;
  if(el=hit('.tile-fav')){e.stopPropagation();toggleFav(el.dataset.fav)}
  else if(el=hit('[data-nowfav]')){e.stopPropagation();toggleFav(el.dataset.nowfav)}
  else if(el=hit('[data-nowplay]')){
    const inSheet=!!el.closest('#sheet'); // ДО playStation: connect перерисовывает шторку, и строка отсоединяется от DOM
    buzz(HAP.tap);playStation(byId(el.dataset.nowplay));
    if(inSheet)closeSheet();
  }
  else if(el=hit('[data-q]')){
    const i=$('#sInput');if(!i)return;
    i.value=el.dataset.q;saveQuery(el.dataset.q);i.dispatchEvent(new Event('input'));i.focus({preventScroll:true});
  }
  else if(el=hit('[data-qdel]')){queries=queries.filter(x=>x!==el.dataset.qdel);LS.set('queries',queries);const i=$('#sInput');if(i)i.dispatchEvent(new Event('input'))}
  else if(hit('[data-qclear]')){queries=[];LS.set('queries',queries);const i=$('#sInput');if(i)i.dispatchEvent(new Event('input'))}
  else if(el=hit('.tile-play')){e.stopPropagation();commitQuery();buzz(HAP.tap);playStation(byId(el.dataset.play))}
  else if(hit('[data-all]'))setView('all');
  else if(el=hit('[data-sheet]'))openSheet(el.dataset.sheet);
  else if(hit('[data-sheet-close]'))closeSheet();
  else if(el=hit('.sheet-row'))pickSheet(el.dataset.v);
  else if(el=hit('[data-cc]')){state.country=el.dataset.cc;state.chip='Все';setView('home')}
  else if(hit('[data-reset]')){state.country='all';state.chip='Все';render()}
  else if(el=hit('.recent-row')){buzz(HAP.tap);playStation(byId(el.dataset.recent))}
  else if(el=hit('.card')){commitQuery();buzz(HAP.tap);playStation(byId(el.dataset.id))}
  else if(el=hit('.chip[data-chip]')){state.chip=el.dataset.chip;if(state.chip==='Все')state.country='all';render()}
  else if(el=hit('[data-view]'))setView(el.dataset.view);
});

/* Мини-плеер: клик по любому месту (кроме кнопок и слайдера) открывает Now Playing */

document.addEventListener('keydown',e=>{
  const t=e.target;
  if(t.tagName==='INPUT'||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='Escape'){if(!$('#sheet').hidden)closeSheet();else if(nowOpen())closeNow();return}
  if(!$('#sheet').hidden)return;
  /* Space активирует сфокусированную кнопку — не перехватываем */
  if(e.code==='Space'&&!t.closest('button')){e.preventDefault();togglePlay()}
  else if(e.key==='ArrowRight')step(1);
  else if(e.key==='ArrowLeft')step(-1);
  /* ↑/↓ — громкость только в Now Playing: иначе они нужны для прокрутки страницы */
  else if(nowOpen()&&(e.key==='ArrowUp'||e.key==='ArrowDown')){e.preventDefault();setVol(audio.volume+(e.key==='ArrowUp'?.05:-.05))}
});

}

/* ==================== ТАЙМЕР СНА ==================== */
let sleepUntil=0,sleepMin=0,sleepTick=null;
const fmtMMSS=ms=>{const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function renderSleep(){
  $$('#btnSleep,#nowSleep').forEach(b=>b.classList.toggle('active',sleepUntil>0));
  if(sheetKind==='sleep'&&!$('#sheet').hidden)$('#sheetCnt').textContent=sleepUntil?'осталось '+fmtMMSS(sleepUntil-Date.now()):'';
}
function stopSleep(){clearInterval(sleepTick);sleepTick=null;sleepUntil=sleepMin=0;renderSleep()}
function setSleep(min){
  stopSleep();
  if(min){
    sleepMin=min;sleepUntil=Date.now()+min*60000;
    sleepTick=setInterval(()=>{
      if(Date.now()>=sleepUntil){audio.pause();stopSleep();toast('Таймер сна: воспроизведение остановлено')}
      else renderSleep();
    },1000);
    toast('Таймер сна: '+SLEEP.find(x=>x[0]===min)[1]);
  }else toast('Таймер сна выключен');
  renderSleep();
}

/* компактный док (мобайл): скролл вниз — табы сворачиваются в круг, мини-плеер встаёт между кругами */
(function(){
  const main=$('#main'),mq=matchMedia('(max-width:900px)'),dock=m=>document.body.classList.toggle('dock-min',m);
  let last=0,tick=false;
  main.addEventListener('scroll',()=>{
    if(tick)return;tick=true;
    requestAnimationFrame(()=>{
      tick=false;
      if(!mq.matches){dock(false);return}
      const y=Math.max(0,main.scrollTop),d=y-last;
      if(y<12)dock(false);else if(d>8)dock(true);else if(d<-8)dock(false);
      if(Math.abs(d)>8||y<12)last=y;
    });
  },{passive:true});
  mq.addEventListener('change',()=>dock(false));
  /* тап по свёрнутому кругу — раскрыть табы (вместо перехода на вкладку) */
  $('#tabs').addEventListener('click',e=>{
    if(!document.body.classList.contains('dock-min'))return;
    e.stopPropagation();e.preventDefault();buzz(HAP.tap);dock(false);
  },true);
  syncDock();
})();

/* ===== Splash: стрелка шкалы «настраивается» на 100.0 FM; тап — пропустить ===== */
(function(){
  const sp=$('#splash'),f=$('#spFreq');if(!sp)return;
  const t0=performance.now(),from=87.5,to=100.0,dur=2300;
  (function tick(now){
    const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);
    f.textContent=(from+(to-from)*e).toFixed(1);
    if(k<1&&sp.isConnected)requestAnimationFrame(tick);
  })(t0);
  sp.addEventListener('animationend',e=>{if(e.animationName==='splashOut')sp.remove()});
  sp.addEventListener('click',()=>sp.classList.add('out'));
})();
